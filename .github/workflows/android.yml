# Builds SCORZ as an Android app in the cloud (this PC has no Android tools).
# Every run puts two files on the repo's Releases page under "SCORZ Android app":
#   SCORZ.apk  install it on an Android phone to try the app
#   SCORZ.aab  the file to upload to Google Play (made only once the two KEYSTORE secrets exist, see app/README.md)
name: Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'app/**', 'build.js', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SCORZ_VERSION_CODE: ${{ github.run_number }}
      SCORZ_VERSION_NAME: 1.0.${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      SCORZ_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the game page for the app
        run: |
          npm ci
          node build.js --app
      - name: Put the page into the Android project
        working-directory: app
        run: |
          npm ci
          npx cap sync android
      - name: Build the test app (SCORZ.apk)
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SCORZ.apk"
      - name: Build the Google Play file (SCORZ.aab)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: app/android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/scorz-upload.p12"
          SCORZ_KEYSTORE="$RUNNER_TEMP/scorz-upload.p12" ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/SCORZ.aab"
      - name: Put the files on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="SCORZ.apk"; [ -f SCORZ.aab ] && FILES="$FILES SCORZ.aab"
          gh release view android >/dev/null 2>&1 || gh release create android --title "SCORZ Android app" --notes "The newest build of the SCORZ Android app. SCORZ.apk: install on a phone to try it. SCORZ.aab: the file for Google Play."
          gh release upload android $FILES --clobber
          gh release edit android --notes "Build ${{ github.run_number }} (version 1.0.${{ github.run_number }}). SCORZ.apk: install on an Android phone to try it. SCORZ.aab: the file for Google Play (there once the upload key secrets are set)."
