<title>SCORZ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+15&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: full-bleed WebGL stadium at dusk; chunky pixel panels dock to the edges and never cover the pitch center */
:root {
  --ink: #090b16;
  --slate: #161a30;
  --slate-2: #1f2545;
  --slate-3: #2c3463;
  --text: #f5efe0;
  --muted: #a4a9cf;
  --blue: #3d7dff;
  --blue-deep: #1a3c9e;
  --blue-light: #a9c7ff;
  --orange: #ff8a2a;
  --orange-deep: #a34b0b;
  --emerald: #2ee38f;
  --emerald-deep: #0e7a48;
  --gold: #ffcb3d;
  --danger: #ff4d5e;
  --r-rare: #4aa8ff;
  --r-epic: #b65cff;
  --r-legendary: #ffc53a;
  --r-mythic: #ff3d52;
  --r-generational: #ffffff;
  --font-display: 'Jersey 10', 'Silkscreen', 'Courier New', monospace;
  --font-body: 'Jersey 15', 'Trebuchet MS', system-ui, sans-serif;
  --font-label: 'Silkscreen', 'Courier New', monospace;
  --px: 3px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--ink); color: var(--text);
  font-family: var(--font-body); font-size: 20px; line-height: 1.25;
  -webkit-font-smoothing: none; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
}
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--ink); }
#app { position: fixed; inset: 0; pointer-events: none; }
#app > * { pointer-events: auto; }
button { font: inherit; color: inherit; }
body.padnav .padfocus { outline: 4px solid var(--gold); outline-offset: 3px; box-shadow: 0 0 0 7px rgba(255, 203, 61, .28); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
img.px, canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
[hidden] { display: none !important; }

/* ---------- shared pixel parts ---------- */
.panel {
  background: var(--slate);
  border: var(--px) solid var(--ink);
  box-shadow: inset var(--px) var(--px) 0 rgba(255,255,255,.07), inset calc(var(--px) * -1) calc(var(--px) * -1) 0 rgba(0,0,0,.4), 6px 6px 0 rgba(0,0,0,.45);
}
.btn {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  font-family: var(--font-display); font-size: 34px; line-height: 1; letter-spacing: .04em; text-transform: uppercase;
  color: var(--text); background: var(--slate-2); border: var(--px) solid var(--ink);
  padding: 8px 18px 12px; cursor: pointer; text-align: left;
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.35), inset 0 var(--px) 0 rgba(255,255,255,.14), 4px 4px 0 rgba(0,0,0,.45);
  transition: transform .06s steps(2), background .1s;
}
.btn:active { transform: translate(4px, 3px); box-shadow: inset 0 3px 0 rgba(0,0,0,.35), 1px 1px 0 rgba(0,0,0,.45); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn .sub { font-family: var(--font-label); font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.btn.blue { background: var(--blue); box-shadow: inset 0 -6px 0 var(--blue-deep), inset 0 var(--px) 0 rgba(255,255,255,.3), 4px 4px 0 rgba(0,0,0,.45); }
.btn.blue .sub { color: #e2ecff; }
.btn.hazard {
  background: repeating-linear-gradient(135deg, var(--orange) 0 12px, #e86f10 12px 24px);
  box-shadow: inset 0 -6px 0 var(--orange-deep), inset 0 var(--px) 0 rgba(255,255,255,.3), 4px 4px 0 rgba(0,0,0,.45);
  text-shadow: 3px 3px 0 var(--ink);
}
.btn.hazard .sub { color: var(--ink); text-shadow: none; background: var(--gold); padding: 2px 5px; }
.btn.featured { background: linear-gradient(90deg, #5d2a9e, #8e4bd6); box-shadow: inset 0 -6px 0 #3a1d66, inset 0 var(--px) 0 rgba(255,255,255,.22), 4px 4px 0 rgba(0,0,0,.45); }
.btn.featured .sub { color: #e6d6ff; }
.btn.pass { background: linear-gradient(90deg, #a8740f, #d9a512); box-shadow: inset 0 -6px 0 #6b4a08, inset 0 var(--px) 0 rgba(255,255,255,.25), 4px 4px 0 rgba(0,0,0,.45); }
.btn.pass .sub { color: #fff3c9; }
.menu .ghosts { display: flex; gap: 6px 18px; flex-wrap: wrap; }
/* spins, locker and the pass share one row of three smaller buttons */
.menu .meta-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.menu .meta-row .btn { display: grid; justify-items: start; gap: 2px; font-size: clamp(20px, 3.4vh, 26px); padding: 6px 10px 9px; }
.menu .meta-row .btn .sub { font-size: 10px; }
.btn.friends { background: #0e6a7a; box-shadow: inset 0 -6px 0 #074451, inset 0 var(--px) 0 rgba(255,255,255,.22), 4px 4px 0 rgba(0,0,0,.45); }
.btn.friends .sub { color: #c4f4ff; }
/* play with friends */
.on-box { padding: 18px; display: grid; gap: 12px; max-width: 640px; }
.on-in { font-family: var(--font-display); font-size: 28px; color: var(--text); background: var(--ink); border: var(--px) solid var(--slate-3); padding: 6px 10px 8px; min-width: 0; user-select: text; -webkit-user-select: text; }
.on-in.code { width: 5.5ch; text-transform: uppercase; letter-spacing: .12em; }
.on-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.on-row .on-in:not(.code) { flex: 1 1 200px; }
.on-status { margin: 0; min-height: 1.2em; font-family: var(--font-label); font-size: 12px; letter-spacing: .08em; color: var(--gold); }
.on-adv summary { cursor: pointer; }
.on-adv .on-row { margin-top: 8px; }
.on-code { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.on-code b { font-family: var(--font-display); font-weight: 400; font-size: 64px; line-height: .85; letter-spacing: .1em; color: var(--gold); }
.on-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.on-team { background: var(--slate-2); padding: 10px; display: grid; gap: 6px; align-content: start; }
.on-p { font-family: var(--font-display); font-size: 24px; line-height: 1; }
.on-p.me { color: var(--gold); } .on-p.bot { color: var(--muted); font-size: 18px; }
.on-host { display: grid; gap: 8px; justify-items: start; }
.on-host .seg { flex-wrap: wrap; }
.btn.emerald { background: var(--emerald-deep); box-shadow: inset 0 -6px 0 #064a2b, inset 0 var(--px) 0 rgba(255,255,255,.22), 4px 4px 0 rgba(0,0,0,.45); }
.btn.emerald .sub { color: #b9ffd9; }
.btn.small { font-size: 24px; padding: 6px 14px 9px; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--muted); font-size: 22px; padding: 4px 6px; }
.key {
  display: inline-block; min-width: 1.6em; text-align: center; font-family: var(--font-label); font-size: 11px; font-weight: 700;
  color: var(--ink); background: var(--text); padding: 3px 5px 4px; line-height: 1;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.28);
}
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-label); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; background: var(--ink); color: var(--muted); }
.rar { font-family: var(--font-label); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; color: var(--ink); font-weight: 700; }
.rar[data-r="Rare"] { background: var(--r-rare); }
.rar[data-r="Epic"] { background: var(--r-epic); color: #fff; }
.rar[data-r="Legendary"] { background: var(--r-legendary); }
.rar[data-r="Mythic"] { background: var(--r-mythic); color: #fff; }
.rar[data-r="Generational"] { background: linear-gradient(90deg, #ff4d5e, #ffcb3d, #2ee38f, #4aa8ff, #b65cff); color: var(--ink); }
.label { font-family: var(--font-label); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ico { width: 20px; height: 20px; vertical-align: middle; }
.emer { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 30px; line-height: 1; color: var(--emerald); text-shadow: 3px 3px 0 var(--ink); }
.emer img { width: 24px; height: 24px; }

/* hover feedback only where a real pointer can hover, so taps on phones do not leave buttons stuck shifted */
@media (hover: hover) {
  .btn:hover { transform: translateX(4px); }
  .btn:not(.hazard):hover { background: var(--slate-3); }
  .btn[disabled]:hover { transform: none; }
  .btn.blue:hover { background: #5590ff; }
  .btn.emerald:hover { background: #12925a; }
  .btn.featured:hover { background: linear-gradient(90deg, #6c3cd6, #a066ee); }
  .btn.pass:hover { background: linear-gradient(90deg, #c08614, #f0b81a); }
  .btn.friends:hover { background: #148ba0; }
  .btn.ghost:hover { color: var(--text); background: transparent; }
  .iconbtn:hover { background: var(--slate-3); }
  .lcard:hover { background: var(--slate-3); }
}
/* ---------- screens ---------- */
.screen {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding-left: max(16px, var(--safe-area-inset-left, env(safe-area-inset-left, 0px))); padding-right: max(16px, var(--safe-area-inset-right, env(safe-area-inset-right, 0px)));
  padding-block: 16px;
  box-sizing: border-box;
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.topbar .right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.iconbtn { font-family: var(--font-label); font-size: 11px; font-weight: 700; letter-spacing: .08em; background: var(--slate); border: var(--px) solid var(--ink); color: var(--text); padding: 8px 10px; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }

/* lobby: menu on the left, your player on a lit spot in the middle (the 3D camera fits it into .lob-stage), profile on the right */
#scr-lobby {
  display: grid; grid-template-columns: minmax(0, 520px) minmax(260px, 1fr) minmax(0, 400px); grid-template-rows: auto minmax(0, 1fr); gap: 10px 24px;
  background:
    radial-gradient(ellipse 30% 58% at var(--stx, 56%) var(--sty, 54%), rgba(9,11,22,0) 50%, rgba(9,11,22,.46) 100%),
    linear-gradient(90deg, rgba(9,11,22,.88) 0, rgba(9,11,22,.62) 380px, rgba(9,11,22,0) 560px);
}
#scr-lobby .topbar { grid-column: 1 / -1; }
.lobby-main { grid-column: 1; grid-row: 2; align-self: safe center; display: grid; gap: 16px; padding-left: clamp(0px, 2.5vw, 40px); min-width: 0; } /* safe: a short window never pushes the title up under SEASON */
@media (max-height: 700px) and (min-width: 900px) and (orientation: landscape) { #scr-lobby .tagline { display: none; } #scr-lobby .lobby-main { gap: 10px; } } /* short desktop window: drop the tagline so it all fits */
.lob-stage { grid-column: 2; grid-row: 2; min-width: 0; min-height: 0; touch-action: pan-y; }
.title { margin: 0; font-family: var(--font-display); font-weight: 400; line-height: .8; letter-spacing: .02em; font-size: clamp(64px, min(12vw, 17vh), 176px); text-wrap: balance; }
.title span { display: block; }
.title em { font-style: normal; }
.title .t1 { color: var(--text); text-shadow: 5px 5px 0 var(--blue-deep), 10px 10px 0 var(--ink); }
.title .t2 { color: var(--blue); text-shadow: 5px 5px 0 var(--ink), 10px 10px 0 rgba(0,0,0,.4); }
.tagline { margin: 0; max-width: 40ch; color: var(--muted); font-size: 22px; }
.menu { display: grid; gap: 8px; max-width: 440px; }
.menu .btn { font-size: clamp(24px, 4.2vh, 32px); padding: 6px 16px 10px; }
.menu .btn.ghost { font-size: 22px; padding: 2px 6px; justify-self: start; }
/* PLAY: the big first button (a quick match), with a slow shine so new players know where to start */
.menu .btn.play { font-size: clamp(36px, 6.4vh, 48px); padding: 8px 18px 12px; position: relative; overflow: hidden; }
.menu .btn.play::after { content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 22%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.28), transparent); transform: skewX(-18deg); animation: playShine 3.2s ease-in-out infinite; pointer-events: none; }
@keyframes playShine { 0%, 55% { left: -40%; } 100% { left: 130%; } }
@media (prefers-reduced-motion: reduce) { .menu .btn.play::after { animation: none; display: none; } }
.lobby-foot { grid-column: 3; grid-row: 2; align-self: end; justify-self: end; display: grid; gap: 10px; justify-items: end; min-width: 0; }
.profile { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; padding: 14px 16px; min-width: 0; width: min(400px, 100%); box-sizing: border-box; }
.profile .badge { width: 64px; height: 64px; grid-row: span 2; }
#lob-profile { cursor: pointer; }
@media (hover: hover) { #lob-profile:hover { background: var(--slate-2); } }
.profile .tier { font-family: var(--font-display); font-size: 38px; line-height: .9; }
.rpbar { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; height: 12px; }
.rpbar i { background: var(--ink); }
.rpbar i.on { background: var(--gold); }
.equip-row { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: var(--px) solid var(--ink); padding-top: 10px; margin-top: 4px; }
.equip-row b { font-family: var(--font-display); font-size: 24px; font-weight: 400; }
.notice { max-width: 400px; font-size: 18px; color: var(--text); text-shadow: 2px 2px 0 var(--ink); margin: 0; text-align: right; }
.notice:empty { display: none; }
.gift { font: inherit; font-size: 17px; color: #ffe066; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-shadow: 2px 2px 0 var(--ink); text-align: right; }
.gift b { color: #fff; font-weight: inherit; }
@media (hover: hover) { .gift:hover { color: #fff; } }
/* narrow screens: one column, the player stands between the title and the buttons */
@media (max-width: 860px) {
  #scr-lobby {
    grid-template-columns: minmax(0, 1fr); grid-template-rows: none; align-content: start; gap: 10px;
    background: linear-gradient(to top, rgba(9,11,22,.9) 0%, rgba(9,11,22,.62) 46%, rgba(9,11,22,0) 66%), linear-gradient(to bottom, rgba(9,11,22,.8) 0, rgba(9,11,22,.5) 240px, rgba(9,11,22,0) 330px);
  }
  .tagline { color: var(--text); text-shadow: 2px 2px 0 var(--ink); font-size: 19px; }
  .lobby-main { display: contents; }
  #scr-lobby > *, .lobby-main > * { grid-column: 1; grid-row: auto; }
  .title { order: 1; } .tagline { order: 2; } .lob-stage { order: 3; height: clamp(230px, 36vh, 440px); } .menu { order: 4; } .lobby-foot { order: 5; }
  .lobby-foot { justify-self: stretch; justify-items: stretch; }
  .notice, .gift { text-align: left; }
}

/* sub screens */
.sub-screen { background: rgba(9,11,22,.9); }
.sub-wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
.sub-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sub-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 64px; line-height: .9; text-shadow: 4px 4px 0 var(--ink); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { font-family: var(--font-display); font-size: 26px; padding: 6px 16px 9px; background: var(--slate); border: var(--px) solid var(--ink); color: var(--muted); cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.35); }
.tab[aria-selected="true"] { background: var(--text); color: var(--ink); }

/* spins: a 3D block drops onto the lit spot (the camera fits it into #sp-fit) and cracks open on your prize */
#scr-spins { overflow: hidden; background: radial-gradient(ellipse 26% 46% at var(--stx, 50%) var(--sty, 45%), rgba(9,11,22,.08) 35%, rgba(9,11,22,.88) 100%); }
.sp-wrap { height: 100%; grid-template-rows: auto auto minmax(0, 1fr) auto auto; }
.sp-stage { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; min-height: 0; }
.sp-fit { min-height: 0; }
#spin-skip { position: absolute; right: 0; top: 0; }
.sp-result { justify-self: center; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px; padding: 8px 14px; min-height: 52px; box-sizing: border-box; visibility: hidden; font-family: var(--font-display); font-size: 34px; line-height: 1; }
.sp-result.show { visibility: visible; animation: riseIn .35s steps(4); }
@keyframes riseIn { from { transform: translateY(14px); opacity: 0; } }
.sp-result canvas { width: 48px; height: 48px; }
.sp-result .tag { font-family: var(--font-label); font-size: 12px; padding: 4px 8px; background: var(--emerald); color: var(--ink); }
.sp-result .tag.dupe { background: var(--muted); }
.spin-ctl { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.odds { display: flex; gap: 6px; flex-wrap: wrap; }

/* locker: your player in 3D on the left (the camera fits it into #lk-fit), cards and details on the right.
   The page itself does not scroll; only the right side does, so the preview stays in view */
#scr-locker { overflow: hidden; background: radial-gradient(ellipse 22% 46% at var(--stx, 20%) var(--sty, 50%), rgba(9,11,22,.1) 35%, rgba(9,11,22,.9) 100%); }
.lk-wrap { height: 100%; grid-template-rows: auto minmax(0, 1fr); }
.locker { display: grid; grid-template-columns: minmax(220px, 340px) minmax(0, 1fr); gap: 16px; min-height: 0; }
.lk-stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; min-height: 0; }
.lk-fit { position: relative; min-height: 0; touch-action: none; cursor: grab; }
.lk-fit:active { cursor: grabbing; }
.lk-drag { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); white-space: nowrap; text-shadow: 1px 1px 0 var(--ink); pointer-events: none; }
.lk-cap { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 12px; }
.lk-cap b { font-family: var(--font-display); font-size: 30px; font-weight: 400; line-height: .9; }
.lk-cap .btn, .lk-cap .lk-lock { margin-left: auto; }
.lk-side { display: grid; grid-auto-rows: max-content; gap: 10px; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
.lk-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
.lk-body .detail { position: sticky; top: 0; }
.tabs.slots .tab { font-size: 20px; padding: 4px 10px 7px; }
/* presets (the Locker's PRESETS tab): what is saved, the position buttons, the save button */
.pre-sum { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: baseline; }
.pre-sum b { font-family: var(--font-display); font-size: 22px; font-weight: 400; line-height: 1; overflow-wrap: anywhere; }
.pre-act { display: flex; gap: 8px; flex-wrap: wrap; }
.pre-name { width: 100%; max-width: 420px; text-transform: none; }
.pre-warn { margin: 0; color: var(--gold); font-family: var(--font-label); font-size: 12px; letter-spacing: .06em; }
.lcard .art { display: flex; gap: 8px; align-items: center; min-width: 0; }
.lcard canvas { width: 40px; height: 40px; flex: none; }
.kits { display: flex; gap: 12px; flex-wrap: wrap; }
.kitbox { display: grid; justify-items: center; gap: 4px; padding: 8px 10px; background: #59608a; }
.kitbox .label { color: var(--text); }
.kitbox canvas { width: 56px; height: 56px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.lcard { text-align: left; cursor: pointer; display: grid; gap: 6px; padding: 10px; background: var(--slate-2); border: var(--px) solid var(--ink); box-shadow: inset 4px 0 0 var(--rc, var(--r-rare)), inset 0 -5px 0 rgba(0,0,0,.3); }
.lcard[aria-pressed="true"] { outline: var(--px) solid var(--text); outline-offset: -6px; }
.lcard.locked { opacity: .5; }
.lcard .nm { font-family: var(--font-display); font-size: 26px; line-height: .9; }
.lcard .meta { display: flex; justify-content: space-between; align-items: center; gap: 4px 6px; flex-wrap: wrap; }
.detail { padding: 18px; display: grid; gap: 14px; }
.detail h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 4.4vw, 54px); line-height: .85; overflow-wrap: anywhere; }
.detail .head > div { min-width: 0; }
.detail .head { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; }
.detail canvas { width: 96px; height: 96px; }
.ab-list { display: grid; gap: 10px; }
.ab { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; }
.ab img { width: 40px; height: 40px; }
.ab .t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ab .t b { font-family: var(--font-display); font-size: 26px; font-weight: 400; line-height: .9; }
.ab p { margin: 2px 0 0; color: var(--muted); font-size: 19px; max-width: 60ch; }

/* profile: the card (level, rank, what you wear), best stats, then the last 20 matches */
.pf-top { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.pf-card, .pf-best, .pf-hist { padding: 16px; display: grid; gap: 14px; }
.pf-card h3, .pf-best h3, .pf-hist h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: .9; }

}

.gp-top, .gp-week, .gp-track-box { padding: 16px; display: grid; gap: 12px; }

.gp-badge { width: 108px; height: 118px; display: grid; justify-items: center; align-content: center; gap: 2px; padding-bottom: 14px; box-sizing: border-box;
  background: linear-gradient(180deg, #e3b21d, #a8740f); clip-path: polygon(0 0, 100% 0, 100% 76%, 50% 100%, 0 76%); }
.gp-badge b { font-family: var(--font-display); font-weight: 400; font-size: 70px; line-height: .8; color: #fff7d6; text-shadow: 4px 4px 0 #6b4a08; }

.gp-bar i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--gold) 0 14px, #d9a512 14px 16px); }
.gp-bar span { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-family: var(--font-label); font-size: 10px; letter-spacing: .06em; color: var(--text); text-shadow: 1px 1px 0 var(--ink); }

.arr.l { border-right-color: currentColor; border-left-width: 0; } .arr.r { border-left-color: currentColor; border-right-width: 0; }
.gp-scroll { overflow-x: auto; overflow-y: hidden; padding: 4px 2px 8px; scrollbar-color: var(--slate-3) var(--ink); -webkit-overflow-scrolling: touch; }

@media (max-width: 720px) { .gp-top { grid-template-columns: auto minmax(0, 1fr); } .gp-next { grid-column: 1 / -1; width: auto; grid-template-columns: auto auto minmax(0, 1fr) auto; justify-items: start; align-items: center; text-align: left; gap: 10px; } .gp-next canvas { width: 40px; height: 40px; } }

/* CrazyGames: blocks the screen while a video ad may play */

.on-privacy { color: var(--muted); max-width: 60ch; }

/* you have the ball: a frame round the crosshair and BALL under it */
.crosshair.ball { outline: 3px solid #ffe9a8; outline-offset: 7px; }
#hud .slowfx { inset: 0; background: radial-gradient(ellipse at center, rgba(120,150,255,.06) 35%, rgba(80,105,235,.34) 68%, rgba(34,36,120,.72) 100%); box-shadow: inset 0 0 0 6px rgba(159,180,255,.6), inset 0 0 60px rgba(120,150,255,.5); animation: slowIn .25s ease-out; }
#hud .slowfx b { position: absolute; left: 50%; top: 21%; transform: translateX(-50%); font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 5vw, 44px); letter-spacing: .12em; color: #dfe6ff; text-shadow: 3px 3px 0 var(--ink), 0 0 18px #7f95ff; white-space: nowrap; }
#hud .slowfx.caught { background: radial-gradient(ellipse at center, rgba(160,170,190,0) 45%, rgba(110,120,150,.32) 80%, rgba(56,60,86,.62) 100%); box-shadow: inset 0 0 0 4px rgba(190,200,220,.35); }

/* the emote wheel */
#emote-pop { position: absolute; left: 50%; bottom: calc(24px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))); transform: translateX(-50%); width: min(520px, calc(100% - 32px)); padding: 12px; display: grid; gap: 8px; box-sizing: border-box; z-index: 30; }

/* MORE MODES (MODE_ART): the featured mode as a big striped card in its colour, then the groups, every mode with its own
   pixel icon on a dark tile ringed in its colour; descriptions in the body font so they read easily */
.modes-box { width: min(820px, 100%); max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; }
.md-head { display: grid; gap: 4px; }

.md-hero, .md-card { all: unset; box-sizing: border-box; cursor: pointer; position: relative; display: grid; align-items: center; background: var(--slate-2); border: var(--px) solid var(--ink); box-shadow: inset 0 -5px 0 rgba(0,0,0,.3), 4px 4px 0 rgba(0,0,0,.45); }

/* STORY scenes: acted out in 3D by Movie between black film bars (.cs.mv: the page shows the stadium behind), with the

   film it falls back to a comic backdrop (.cs-bg) */
.cs { position: absolute; inset: 0; z-index: 70; overflow: hidden; background: #000; cursor: pointer; --bar: clamp(26px, 10vh, 92px); }
.cs.mv { background: transparent; }
.cs.mv .cs-bg { display: none; }

.cs-bg { position: absolute; inset: 0; background: var(--sky); }

.cs-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 36%; background: repeating-linear-gradient(90deg, transparent 0 70px, rgba(0,0,0,.16) 70px 140px), var(--ground); box-shadow: inset 0 6px 0 rgba(255,255,255,.12); }
.cs-lines { position: absolute; inset: -20%; background: repeating-conic-gradient(from 0deg at 50% 62%, transparent 0deg 4deg, rgba(255,255,255,.07) 4deg 5deg); }
.cs-bar { display: none; position: absolute; left: 0; right: 0; height: var(--bar); background: #000; z-index: 1; pointer-events: none; }
.cs.mv .cs-bar { display: block; }
.cs-bar.t { top: 0; animation: csBarT .6s cubic-bezier(.2, .8, .3, 1) both; } .cs-bar.b { bottom: 0; animation: csBarB .6s cubic-bezier(.2, .8, .3, 1) both; }
@keyframes csBarT { from { transform: translateY(-100%); } } @keyframes csBarB { from { transform: translateY(100%); } }
.cs-flash { position: absolute; inset: 0; z-index: 2; opacity: 0; pointer-events: none; }
.cs-flash.go { animation: csFlash .55s ease-out both; }
@keyframes csFlash { from { opacity: .85; } to { opacity: 0; } }
.cs-place { position: absolute; left: 4%; top: calc(var(--bar) + 16px); z-index: 2; display: grid; gap: 4px; padding: 10px 18px 12px 14px; background: rgba(8, 6, 14, .78); box-shadow: inset 4px 0 0 var(--gold); pointer-events: none; }
.cs-place span { font-family: var(--font-label); font-size: 11px; letter-spacing: .2em; color: var(--gold); }

@keyframes csPlace { 0% { transform: translateX(-30px); opacity: 0; } 10%, 78% { transform: none; opacity: 1; } 100% { opacity: 0; } }
.cs-face { position: absolute; left: 14px; top: 14px; width: 92px; height: 92px; background: #0c0a12; box-shadow: 0 0 0 3px var(--sc, #ffcb3d); }
.cs-face:empty { display: none; }
.cs-face canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.cs-face.in { animation: csPop .26s steps(3) both; }
@keyframes csPop { from { transform: scale(.4); } to { transform: none; } }
.cs-box { all: unset; box-sizing: border-box; cursor: pointer; position: absolute; left: 4%; right: 4%; bottom: 22px; z-index: 3; min-height: 120px; padding: 14px 22px 30px 124px; display: grid; align-content: start; gap: 8px; background: #0c0a12; box-shadow: inset 0 0 0 3px var(--sc, #ffcb3d), 6px 6px 0 rgba(0,0,0,.5); }
.cs.mv .cs-box { bottom: calc(var(--bar) * .35); background: rgba(10, 8, 16, .86); }
.cs-box:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.cs-name { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: .9; color: var(--sc, #ffcb3d); }

.cs-title { position: absolute; inset: 0; z-index: 4; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; background: rgba(0,0,0,.55); }

@keyframes csSlam { from { transform: scale(2.4); opacity: 0; } to { transform: none; opacity: 1; } }
.cs-join { position: absolute; left: 50%; top: calc(var(--bar) + 12px); z-index: 4; transform: translateX(-50%); display: grid; justify-items: center; gap: 6px; padding: 14px 24px 16px; background: #0c0a12; box-shadow: 0 0 0 4px var(--sc), 0 0 60px var(--sc); pointer-events: none; }
.cs-jface canvas { width: 128px; height: 128px; display: block; image-rendering: pixelated; }
.cs-join b { font-family: var(--font-display); font-weight: 400; font-size: 52px; line-height: .85; color: var(--sc); text-shadow: 3px 3px 0 #000; }

@keyframes csJoin { from { transform: translateX(-50%) scale(.3); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
/* VS: your club slides in from the left, theirs from the right, VS slams in the middle, the goal underneath */
.cs-vs { position: absolute; inset: 0; z-index: 4; display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: 1fr auto; align-items: center; background: rgba(0,0,0,.45); pointer-events: none; }
.vs-side { display: grid; justify-items: center; gap: 6px; padding: 26px 12px; background: linear-gradient(90deg, transparent, var(--vc) 40%, var(--vc) 60%, transparent); clip-path: polygon(0 12%, 100% 0, 100% 88%, 0 100%); text-align: center; }

.vs-side b { font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 7vh, 64px); line-height: .85; color: #fff; text-shadow: 4px 4px 0 #000; }

.vs-goal { grid-column: 1 / -1; justify-self: center; margin: 0 0 calc(var(--bar) + 18px); padding: 10px 18px; background: #0c0a12; box-shadow: inset 0 0 0 3px var(--gold); font-family: var(--font-label); font-size: 13px; letter-spacing: .1em; color: #fff; text-align: center; max-width: 92%; }
.cs-vs.go .vs-side.l { animation: vsL .45s cubic-bezier(.2, .9, .3, 1.1) both; } .cs-vs.go .vs-side.r { animation: vsR .45s cubic-bezier(.2, .9, .3, 1.1) both; }

@keyframes vsL { from { transform: translateX(-110%); } } @keyframes vsR { from { transform: translateX(110%); } }
/* ANIME MOMENTS (Movie): speed lines, the eye strip, impact frames, big comic words and the manga page */
.cs-speed, .cs-pan { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cs-speed { z-index: 1; }
.cs-pan { z-index: 2; }

/* the ending after every match (Cine): VICTORY / DEFEAT / DRAW / SHATTERED! over speed lines, the score and the star player */
#outro { position: absolute; left: 0; right: 0; top: 14%; text-align: center; pointer-events: none; z-index: 30; }
#outro .ot-lines { position: absolute; left: 50%; top: 40px; width: 160vmax; height: 160vmax; transform: translate(-50%, -50%); background: repeating-conic-gradient(from 0deg, transparent 0deg 3.2deg, var(--oc, #fff) 3.2deg 3.9deg, transparent 3.9deg 7.1deg, rgba(255, 255, 255, .3) 7.1deg 7.5deg); -webkit-mask-image: radial-gradient(circle, transparent 9%, #000 26%, transparent 46%); mask-image: radial-gradient(circle, transparent 9%, #000 26%, transparent 46%); opacity: 0; }
#outro b { position: relative; display: block; font-family: var(--font-display); font-size: clamp(60px, 14vw, 200px); line-height: .9; color: #fff; -webkit-text-stroke: 3px var(--oc, #fff); text-shadow: 0 0 30px var(--oc, #fff), 8px 8px 0 #000; }
#outro span { position: relative; display: block; margin-top: 12px; font-family: var(--font-label); letter-spacing: .16em; text-shadow: 2px 2px 0 #000; }
#outro #ot-sub { font-size: clamp(13px, 1.8vw, 20px); color: #fff; }
#outro #ot-star { font-size: clamp(11px, 1.4vw, 15px); color: var(--gold); }
#outro .ot-skip { position: fixed; left: 0; right: 0; bottom: 22px; font-size: 11px; color: var(--muted); }
#outro.go .ot-lines { animation: otLines 1.6s ease-out forwards; }
#outro.go b { animation: otSlam .55s cubic-bezier(.2, .9, .3, 1.25); }
#outro.go #ot-sub, #outro.go #ot-star { animation: otUp .5s .35s both; }
@keyframes otSlam { 0% { transform: scale(3); opacity: 0; } 60% { transform: scale(.92); opacity: 1; } 100% { transform: scale(1); } }
@keyframes otLines { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(0deg); } 15% { opacity: .75; } 100% { opacity: .3; transform: translate(-50%, -50%) rotate(12deg); } }
@keyframes otUp { 0% { opacity: 0; transform: translateY(14px); } 100% { opacity: 1; transform: none; } }
/* cinematics (a core grab, the OMEGA SNAP, the ending): only the score stays, so the moment fills the screen */
body.cine #hud > *:not(.scorebar):not(.banner):not(.steal):not(.vaultbar):not(.hud-mode) { visibility: hidden; }
body.cine #labels { visibility: hidden; }
#scoreboard { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100% - 32px)); padding: 16px; box-sizing: border-box; }

/* the Awakening (owner, Nov 2026: "make the animations cooler like [anime] awakenings"), 2.9s: a black and white memory

#awk { position: absolute; inset: 0; z-index: 28; overflow: hidden; }

#awk .awk-mem { position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%) skewX(-8deg); display: grid; gap: 4px; text-align: center; padding: 10px 20px; opacity: 0; max-width: calc(100% - 32px); box-sizing: border-box; background: #f4f4f4; color: #050508; box-shadow: 6px 6px 0 #050508; }

#awk .awk-eye { position: absolute; left: 0; right: 0; top: 50%; height: min(25vw, 38vh); transform: translateY(-50%) scaleY(0); opacity: 0; border-block: 6px solid #050508; box-shadow: 0 0 0 3px var(--ci, #fff); overflow: hidden; }
#awk .awk-eye canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; object-fit: cover; filter: contrast(1.15); }
#awk .awk-iris { position: absolute; top: 62%; width: 12%; aspect-ratio: 1; transform: translate(-50%, -50%) scale(.2); border-radius: 50%; background: radial-gradient(circle, #fff 0 12%, var(--ci, #fff) 30%, transparent 70%); mix-blend-mode: screen; opacity: 0; }
#awk .awk-iris.l { left: 33.6%; } #awk .awk-iris.r { left: 66.4%; }
#awk .awk-flare { position: absolute; left: 66.4%; top: 62%; width: 70%; height: 7%; transform-origin: 0 50%; transform: translateY(-50%) scaleX(0); background: linear-gradient(90deg, #fff, var(--ci, #fff) 30%, transparent); box-shadow: 0 0 18px 6px var(--ci, #fff); border-radius: 99px; opacity: 0; }
#awk .awk-flash { position: absolute; inset: 0; background: var(--ci, #fff); opacity: 0; mix-blend-mode: screen; }

#awk .awk-big { position: absolute; left: 0; right: 0; top: 14%; text-align: center; font-family: var(--font-display); font-size: clamp(44px, 12.5vw, 168px); line-height: 1; letter-spacing: .02em; color: #fff; -webkit-text-stroke: 3px var(--ci, #fff); text-shadow: 0 0 28px var(--ci, #fff), 7px 7px 0 #050508; opacity: 0; transform: skewX(-10deg); white-space: nowrap; }
#awk .awk-now { position: absolute; left: 0; right: 0; top: 64%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; gap: clamp(12px, 3vw, 28px); padding: 14px 16px; background: linear-gradient(90deg, transparent, rgba(5,5,8,.9) 16%, rgba(5,5,8,.9) 84%, transparent); border-block: 6px solid var(--ci, #fff); opacity: 0; }

/* ---------- touch controls: thumb arc of pixel-round buttons, floating stick ---------- */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body { -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#touch {
  position: absolute; inset: 0; touch-action: none; overflow: hidden; -webkit-user-select: none; user-select: none;
  --pxc: polygon(25% 0, 75% 0, 75% 12.5%, 87.5% 12.5%, 87.5% 25%, 100% 25%, 100% 75%, 87.5% 75%, 87.5% 87.5%, 75% 87.5%, 75% 100%, 25% 100%, 25% 87.5%, 12.5% 87.5%, 12.5% 75%, 0 75%, 0 25%, 12.5% 25%, 12.5% 12.5%, 25% 12.5%);
}
#touch .tb {
  position: absolute; left: 0; top: 0; width: var(--sz, 60px); height: var(--sz, 60px); box-sizing: border-box;
  transform: translate(calc(var(--x, 0px) - 50%), calc(var(--y, 0px) - 50%));
  -webkit-clip-path: var(--pxc); clip-path: var(--pxc); background: rgba(9,11,22,.66);
}
#touch .tb::before { content: ""; position: absolute; inset: 3px; -webkit-clip-path: var(--pxc); clip-path: var(--pxc); background: var(--fill, rgba(44,52,99,.5)); }
#touch .tb .ic { position: absolute; left: 25%; top: 15%; width: 50%; height: 50%; background: center / contain no-repeat; image-rendering: pixelated; pointer-events: none; }
#touch .tb .lb {
  position: absolute; left: 7%; right: 7%; bottom: 13%; text-align: center; pointer-events: none;
  font-family: var(--font-label); font-weight: 700; font-size: max(6px, calc(var(--sz, 60px) * var(--lbk, .135))); line-height: 1; letter-spacing: 0;
  color: var(--text); text-shadow: 1px 1px 0 var(--ink); white-space: nowrap; overflow: hidden;
}
#touch .tb .cd { position: absolute; inset: 3px; -webkit-clip-path: var(--pxc); clip-path: var(--pxc); background: conic-gradient(rgba(9,11,22,.8) var(--p, 0deg), transparent 0); pointer-events: none; }
#touch .tb .num { position: absolute; left: 0; right: 0; top: 0; bottom: 20%; display: grid; place-items: center; font-family: var(--font-display); font-size: calc(var(--sz, 60px) * .48); line-height: 1; text-shadow: 2px 2px 0 var(--ink); pointer-events: none; }
#touch .tb .num:empty { display: none; }
#touch .tb.big { --fill: rgba(61,125,255,.52); }
#touch .tb.big .lb { bottom: 15%; }
#touch .tb.pass { --fill: rgba(26,60,158,.5); }
#touch .tb .chg { position: absolute; inset: 3px; -webkit-clip-path: var(--pxc); clip-path: var(--pxc); background: linear-gradient(to top, rgba(255,203,61,.62) var(--c, 0%), transparent 0); pointer-events: none; }
#touch .tb.charging .ic { transform: scale(1.1); }
#touch .tb.down { --fill: rgba(255,203,61,.42); }
#touch .tb.down .ic { transform: translateY(2px); }
#touch .tb.big.down { --fill: rgba(90,150,255,.72); }
