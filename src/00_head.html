<title>SCORZ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+15&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: full-bleed WebGL stadium at dusk; chunky pixel panels dock to the edges and never cover the pitch center */
:root {
  --ink: #090b16;
  --slate: #161a30;
  --slate-2: #1f2545;
  --slate-3: #2c3463;
  --text: #f5efe0;
  --muted: #a4a9cf;
  --blue: #3d7dff;
  --blue-deep: #1a3c9e;
  --blue-light: #a9c7ff;
  --orange: #ff8a2a;
  --orange-deep: #a34b0b;
  --emerald: #2ee38f;
  --emerald-deep: #0e7a48;
  --gold: #ffcb3d;
  --danger: #ff4d5e;
  --r-rare: #4aa8ff;
  --r-epic: #b65cff;
  --r-legendary: #ffc53a;
  --r-mythic: #ff3d52;
  --r-generational: #ffffff;
  --font-display: 'Jersey 10', 'Silkscreen', 'Courier New', monospace;
  --font-body: 'Jersey 15', 'Trebuchet MS', system-ui, sans-serif;
  --font-label: 'Silkscreen', 'Courier New', monospace;
  --px: 3px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--ink); color: var(--text);
  font-family: var(--font-body); font-size: 20px; line-height: 1.25;
  -webkit-font-smoothing: none; user-select: none; -webkit-user-select: none;
}
canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--ink); }
#app { position: fixed; inset: 0; pointer-events: none; }
#app > * { pointer-events: auto; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
img.px, canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; }
[hidden] { display: none !important; }

/* ---------- shared pixel parts ---------- */
.panel {
  background: var(--slate);
  border: var(--px) solid var(--ink);
  box-shadow: inset var(--px) var(--px) 0 rgba(255,255,255,.07), inset calc(var(--px) * -1) calc(var(--px) * -1) 0 rgba(0,0,0,.4), 6px 6px 0 rgba(0,0,0,.45);
}
.btn {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  font-family: var(--font-display); font-size: 34px; line-height: 1; letter-spacing: .04em; text-transform: uppercase;
  color: var(--text); background: var(--slate-2); border: var(--px) solid var(--ink);
  padding: 8px 18px 12px; cursor: pointer; text-align: left;
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.35), inset 0 var(--px) 0 rgba(255,255,255,.14), 4px 4px 0 rgba(0,0,0,.45);
  transition: transform .06s steps(2), background .1s;
}
.btn:active { transform: translate(4px, 3px); box-shadow: inset 0 3px 0 rgba(0,0,0,.35), 1px 1px 0 rgba(0,0,0,.45); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }
.btn .sub { font-family: var(--font-label); font-size: 11px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.btn.blue { background: var(--blue); box-shadow: inset 0 -6px 0 var(--blue-deep), inset 0 var(--px) 0 rgba(255,255,255,.3), 4px 4px 0 rgba(0,0,0,.45); }
.btn.blue .sub { color: #e2ecff; }
.btn.hazard {
  background: repeating-linear-gradient(135deg, var(--orange) 0 12px, #e86f10 12px 24px);
  box-shadow: inset 0 -6px 0 var(--orange-deep), inset 0 var(--px) 0 rgba(255,255,255,.3), 4px 4px 0 rgba(0,0,0,.45);
  text-shadow: 3px 3px 0 var(--ink);
}
.btn.hazard .sub { color: var(--ink); text-shadow: none; background: var(--gold); padding: 2px 5px; }
.btn.featured { background: linear-gradient(90deg, #5d2a9e, #8e4bd6); box-shadow: inset 0 -6px 0 #3a1d66, inset 0 var(--px) 0 rgba(255,255,255,.22), 4px 4px 0 rgba(0,0,0,.45); }
.btn.featured .sub { color: #e6d6ff; }
.btn.pass { background: linear-gradient(90deg, #a8740f, #d9a512); box-shadow: inset 0 -6px 0 #6b4a08, inset 0 var(--px) 0 rgba(255,255,255,.25), 4px 4px 0 rgba(0,0,0,.45); }
.btn.pass .sub { color: #fff3c9; }
.menu .ghosts { display: flex; gap: 6px 18px; flex-wrap: wrap; }
.btn.emerald { background: var(--emerald-deep); box-shadow: inset 0 -6px 0 #064a2b, inset 0 var(--px) 0 rgba(255,255,255,.22), 4px 4px 0 rgba(0,0,0,.45); }
.btn.emerald .sub { color: #b9ffd9; }
.btn.small { font-size: 24px; padding: 6px 14px 9px; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--muted); font-size: 22px; padding: 4px 6px; }
.key {
  display: inline-block; min-width: 1.6em; text-align: center; font-family: var(--font-label); font-size: 11px; font-weight: 700;
  color: var(--ink); background: var(--text); padding: 3px 5px 4px; line-height: 1;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.28);
}
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-label); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; background: var(--ink); color: var(--muted); }
.rar { font-family: var(--font-label); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; color: var(--ink); font-weight: 700; }
.rar[data-r="Rare"] { background: var(--r-rare); }
.rar[data-r="Epic"] { background: var(--r-epic); color: #fff; }
.rar[data-r="Legendary"] { background: var(--r-legendary); }
.rar[data-r="Mythic"] { background: var(--r-mythic); color: #fff; }
.rar[data-r="Generational"] { background: linear-gradient(90deg, #ff4d5e, #ffcb3d, #2ee38f, #4aa8ff, #b65cff); color: var(--ink); }
.label { font-family: var(--font-label); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.ico { width: 20px; height: 20px; vertical-align: middle; }
.emer { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 30px; line-height: 1; color: var(--emerald); text-shadow: 3px 3px 0 var(--ink); }
.emer img { width: 24px; height: 24px; }

/* hover feedback only where a real pointer can hover, so taps on phones do not leave buttons stuck shifted */
@media (hover: hover) {
  .btn:hover { transform: translateX(4px); }
  .btn:not(.hazard):hover { background: var(--slate-3); }
  .btn[disabled]:hover { transform: none; }
  .btn.blue:hover { background: #5590ff; }
  .btn.emerald:hover { background: #12925a; }
  .btn.featured:hover { background: linear-gradient(90deg, #6c3cd6, #a066ee); }
  .btn.pass:hover { background: linear-gradient(90deg, #c08614, #f0b81a); }
  .btn.ghost:hover { color: var(--text); background: transparent; }
  .iconbtn:hover { background: var(--slate-3); }
  .lcard:hover { background: var(--slate-3); }
}
/* ---------- screens ---------- */
.screen {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.topbar .right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.iconbtn { font-family: var(--font-label); font-size: 11px; font-weight: 700; letter-spacing: .08em; background: var(--slate); border: var(--px) solid var(--ink); color: var(--text); padding: 8px 10px; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.35); }

/* lobby: menu on the left, your player on a lit spot in the middle (the 3D camera fits it into .lob-stage), profile on the right */
#scr-lobby {
  display: grid; grid-template-columns: minmax(0, 520px) minmax(260px, 1fr) minmax(0, 400px); grid-template-rows: auto minmax(0, 1fr); gap: 10px 24px;
  background:
    radial-gradient(ellipse 30% 58% at var(--stx, 56%) var(--sty, 54%), rgba(9,11,22,0) 50%, rgba(9,11,22,.46) 100%),
    linear-gradient(90deg, rgba(9,11,22,.88) 0, rgba(9,11,22,.62) 380px, rgba(9,11,22,0) 560px);
}
#scr-lobby .topbar { grid-column: 1 / -1; }
.lobby-main { grid-column: 1; grid-row: 2; align-self: center; display: grid; gap: 16px; padding-left: clamp(0px, 2.5vw, 40px); min-width: 0; }
.lob-stage { grid-column: 2; grid-row: 2; min-width: 0; min-height: 0; touch-action: pan-y; }
.title { margin: 0; font-family: var(--font-display); font-weight: 400; line-height: .8; letter-spacing: .02em; font-size: clamp(64px, min(12vw, 17vh), 176px); text-wrap: balance; }
.title span { display: block; }
.title em { font-style: normal; }
.title .t1 { color: var(--text); text-shadow: 5px 5px 0 var(--blue-deep), 10px 10px 0 var(--ink); }
.title .t2 { color: var(--blue); text-shadow: 5px 5px 0 var(--ink), 10px 10px 0 rgba(0,0,0,.4); }
.tagline { margin: 0; max-width: 40ch; color: var(--muted); font-size: 22px; }
.menu { display: grid; gap: 8px; max-width: 440px; }
.menu .btn { font-size: clamp(24px, 4.2vh, 32px); padding: 6px 16px 10px; }
.menu .btn.ghost { font-size: 22px; padding: 2px 6px; justify-self: start; }
.lobby-foot { grid-column: 3; grid-row: 2; align-self: end; justify-self: end; display: grid; gap: 10px; justify-items: end; min-width: 0; }
.profile { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: center; padding: 14px 16px; min-width: 0; width: min(400px, 100%); box-sizing: border-box; }
.profile .badge { width: 64px; height: 64px; grid-row: span 2; }
#lob-profile { cursor: pointer; }
@media (hover: hover) { #lob-profile:hover { background: var(--slate-2); } }
.profile .tier { font-family: var(--font-display); font-size: 38px; line-height: .9; }
.rpbar { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; height: 12px; }
.rpbar i { background: var(--ink); }
.rpbar i.on { background: var(--gold); }
.equip-row { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-top: var(--px) solid var(--ink); padding-top: 10px; margin-top: 4px; }
.equip-row b { font-family: var(--font-display); font-size: 24px; font-weight: 400; }
.notice { max-width: 400px; font-size: 18px; color: var(--text); text-shadow: 2px 2px 0 var(--ink); margin: 0; text-align: right; }
.notice:empty { display: none; }
/* narrow screens: one column, the player stands between the title and the buttons */
@media (max-width: 860px) {
  #scr-lobby {
    grid-template-columns: minmax(0, 1fr); grid-template-rows: none; align-content: start; gap: 10px;
    background: linear-gradient(to top, rgba(9,11,22,.9) 0%, rgba(9,11,22,.62) 46%, rgba(9,11,22,0) 66%), linear-gradient(to bottom, rgba(9,11,22,.8) 0, rgba(9,11,22,.5) 240px, rgba(9,11,22,0) 330px);
  }
  .tagline { color: var(--text); text-shadow: 2px 2px 0 var(--ink); font-size: 19px; }
  .lobby-main { display: contents; }
  #scr-lobby > *, .lobby-main > * { grid-column: 1; grid-row: auto; }
  .title { order: 1; } .tagline { order: 2; } .lob-stage { order: 3; height: clamp(230px, 36vh, 440px); } .menu { order: 4; } .lobby-foot { order: 5; }
  .lobby-foot { justify-self: stretch; justify-items: stretch; }
  .notice { text-align: left; }
}

/* sub screens */
.sub-screen { background: rgba(9,11,22,.9); }
.sub-wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 16px; }
.sub-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sub-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 64px; line-height: .9; text-shadow: 4px 4px 0 var(--ink); }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.tab { font-family: var(--font-display); font-size: 26px; padding: 6px 16px 9px; background: var(--slate); border: var(--px) solid var(--ink); color: var(--muted); cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.35); }
.tab[aria-selected="true"] { background: var(--text); color: var(--ink); }

/* spins: a 3D block drops onto the lit spot (the camera fits it into #sp-fit) and cracks open on your prize */
#scr-spins { overflow: hidden; background: radial-gradient(ellipse 26% 46% at var(--stx, 50%) var(--sty, 45%), rgba(9,11,22,.08) 35%, rgba(9,11,22,.88) 100%); }
.sp-wrap { height: 100%; grid-template-rows: auto auto minmax(0, 1fr) auto auto; }
.sp-stage { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; min-height: 0; }
.sp-fit { min-height: 0; }
#spin-skip { position: absolute; right: 0; top: 0; }
.sp-result { justify-self: center; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px; padding: 8px 14px; min-height: 52px; box-sizing: border-box; visibility: hidden; font-family: var(--font-display); font-size: 34px; line-height: 1; }
.sp-result.show { visibility: visible; animation: riseIn .35s steps(4); }
@keyframes riseIn { from { transform: translateY(14px); opacity: 0; } }
.sp-result canvas { width: 48px; height: 48px; }
.sp-result .tag { font-family: var(--font-label); font-size: 12px; padding: 4px 8px; background: var(--emerald); color: var(--ink); }
.sp-result .tag.dupe { background: var(--muted); }
.spin-ctl { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.odds { display: flex; gap: 6px; flex-wrap: wrap; }

/* locker: your player in 3D on the left (the camera fits it into #lk-fit), cards and details on the right.
   The page itself does not scroll; only the right side does, so the preview stays in view */
#scr-locker { overflow: hidden; background: radial-gradient(ellipse 22% 46% at var(--stx, 20%) var(--sty, 50%), rgba(9,11,22,.1) 35%, rgba(9,11,22,.9) 100%); }
.lk-wrap { height: 100%; grid-template-rows: auto minmax(0, 1fr); }
.locker { display: grid; grid-template-columns: minmax(220px, 340px) minmax(0, 1fr); gap: 16px; min-height: 0; }
.lk-stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; min-height: 0; }
.lk-fit { position: relative; min-height: 0; touch-action: none; cursor: grab; }
.lk-fit:active { cursor: grabbing; }
.lk-drag { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); white-space: nowrap; text-shadow: 1px 1px 0 var(--ink); pointer-events: none; }
.lk-cap { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 12px; }
.lk-cap b { font-family: var(--font-display); font-size: 30px; font-weight: 400; line-height: .9; }
.lk-cap .btn, .lk-cap .lk-lock { margin-left: auto; }
.lk-side { display: grid; grid-auto-rows: max-content; gap: 10px; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; }
.lk-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 16px; align-items: start; }
.lk-body .detail { position: sticky; top: 0; }
.tabs.slots .tab { font-size: 20px; padding: 4px 10px 7px; }
.lcard .art { display: flex; gap: 8px; align-items: center; min-width: 0; }
.lcard canvas { width: 40px; height: 40px; flex: none; }
.kits { display: flex; gap: 12px; flex-wrap: wrap; }
.kitbox { display: grid; justify-items: center; gap: 4px; padding: 8px 10px; background: #59608a; }
.kitbox .label { color: var(--text); }
.kitbox canvas { width: 56px; height: 56px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.lcard { text-align: left; cursor: pointer; display: grid; gap: 6px; padding: 10px; background: var(--slate-2); border: var(--px) solid var(--ink); box-shadow: inset 4px 0 0 var(--rc, var(--r-rare)), inset 0 -5px 0 rgba(0,0,0,.3); }
.lcard[aria-pressed="true"] { outline: var(--px) solid var(--text); outline-offset: -6px; }
.lcard.locked { opacity: .5; }
.lcard .nm { font-family: var(--font-display); font-size: 26px; line-height: .9; }
.lcard .meta { display: flex; justify-content: space-between; align-items: center; gap: 4px 6px; flex-wrap: wrap; }
.detail { padding: 18px; display: grid; gap: 14px; }
.detail h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 54px; line-height: .85; }
.detail .head { display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; }
.detail canvas { width: 96px; height: 96px; }
.ab-list { display: grid; gap: 10px; }
.ab { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; }
.ab img { width: 40px; height: 40px; }
.ab .t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ab .t b { font-family: var(--font-display); font-size: 26px; font-weight: 400; line-height: .9; }
.ab p { margin: 2px 0 0; color: var(--muted); font-size: 19px; max-width: 60ch; }

/* profile: the card (level, rank, what you wear), best stats, then the last 20 matches */
.pf-top { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.pf-card, .pf-best, .pf-hist { padding: 16px; display: grid; gap: 14px; }
.pf-card h3, .pf-best h3, .pf-hist h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: .9; }
.pf-head { display: grid; grid-template-columns: 88px auto minmax(0, 1fr); grid-template-areas: "face lv xp" "face rank rank"; gap: 8px 16px; align-items: center; }
.pf-head > canvas { grid-area: face; width: 88px; height: 88px; }
.pf-lv { grid-area: lv; display: grid; justify-items: center; background: var(--ink); padding: 4px 12px 6px; }
.pf-lv b { font-family: var(--font-display); font-weight: 400; font-size: 44px; line-height: .9; color: var(--gold); }
.pf-xp { grid-area: xp; display: grid; gap: 4px; min-width: 0; }
.xpbar { height: 12px; background: var(--ink); border: 2px solid var(--ink); }
.xpbar i { display: block; height: 100%; background: var(--emerald); }
.pf-rank { grid-area: rank; display: flex; gap: 10px; align-items: center; }
.pf-rank img { width: 44px; height: 44px; }
.pf-rank b, .pf-eq b, .pf-grid b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1; }
.pf-eq { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 14px; border-top: var(--px) solid var(--ink); padding-top: 12px; }
.pf-eq > div { display: grid; gap: 3px; justify-items: start; }
.pf-skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pf-skin { display: grid; grid-template-columns: 32px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; background: var(--slate-2); padding: 6px 8px; }
.pf-skin canvas { width: 32px; height: 32px; grid-row: span 2; }
.pf-skin b { font-family: var(--font-display); font-weight: 400; font-size: 20px; line-height: .95; }
.pf-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.pf-grid > div { background: var(--ink); padding: 8px; display: grid; gap: 3px; }
.pf-row { display: grid; grid-template-columns: 110px minmax(0, 1.2fr) minmax(0, 1fr) 88px minmax(0, 1.3fr) 76px; gap: 6px 12px; align-items: center; padding: 8px 0; border-top: 2px solid var(--ink); font-size: 19px; }
.pf-mode { font-family: var(--font-display); font-size: 22px; line-height: 1; }
.pf-score { font-variant-numeric: tabular-nums; }
.pf-res { font-family: var(--font-label); font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 3px 7px; justify-self: start; color: var(--ink); background: var(--muted); }
.pf-res.win { background: var(--emerald); } .pf-res.draw { background: var(--gold); } .pf-res.loss, .pf-res.forfeit { background: var(--danger); color: var(--text); }
.pf-rp { font-family: var(--font-label); font-size: 11px; font-weight: 700; } .pf-rp.up { color: var(--emerald); } .pf-rp.down { color: var(--danger); }
.xpline { display: grid; gap: 4px; }
.xpline .lvup { color: var(--gold); font-weight: 700; animation: blink .6s steps(2) 4; }
@media (max-width: 860px) {
  .pf-top { grid-template-columns: minmax(0, 1fr); }
  .pf-row { grid-template-columns: minmax(0, 1fr) auto; }
  .pf-row > :nth-child(2) { grid-column: 1 / -1; grid-row: 1; }
}

/* game pass: tier and XP, this week's challenges, then the 30-tier reward track */
.gp-top, .gp-week, .gp-track-box { padding: 16px; display: grid; gap: 12px; }
.gp-top { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 10px 20px; }
.gp-top .gp-note { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 18px; }
.gp-tier b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 56px; line-height: .9; color: var(--gold); }
.gp-tier small { font-size: 28px; color: var(--muted); }
.gp-bar { display: grid; gap: 4px; }
.xpbar.pass i { background: var(--gold); }
.gp-week h3, .gp-track-box h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: .9; }
.gp-ch { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.gp-ch > .label { grid-column: 1 / -1; }
.gp-c { background: var(--slate-2); padding: 10px; display: grid; gap: 6px; box-shadow: inset 4px 0 0 var(--muted); }
.gp-c b { font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: .95; }
.gp-c.done { box-shadow: inset 4px 0 0 var(--emerald); }
.gp-c.done .xpbar i { background: var(--emerald); }
.gp-track { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.gp-t { background: var(--slate-2); padding: 8px; display: grid; justify-items: center; gap: 4px; text-align: center; opacity: .6; }
.gp-t canvas { width: 40px; height: 40px; }
.gp-t b { font-family: var(--font-display); font-weight: 400; font-size: 18px; line-height: .95; }
.gp-t.got { opacity: 1; box-shadow: inset 0 0 0 3px var(--gold); }
.gp-t.next { opacity: 1; box-shadow: inset 0 0 0 3px var(--text); }
.passline { display: grid; gap: 4px; }
.passline .pl-ch { color: var(--emerald); } .passline .pl-tier { color: var(--gold); }
@media (max-width: 560px) { .gp-top { grid-template-columns: minmax(0, 1fr); } }

/* how to play */
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.howto section { padding: 16px; }
.howto h3 { margin: 0 0 10px; font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: .9; }
.ctrl { display: grid; grid-template-columns: minmax(0, 132px) minmax(0, 1fr); gap: 6px 14px; align-items: center; font-size: 19px; }
.ctrl > span:nth-child(odd) { display: flex; gap: 4px; flex-wrap: wrap; }
.howto ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; color: var(--muted); font-size: 19px; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--font-body); }
#hud > * { position: absolute; }
.scorebar { top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; gap: 0; }
.scorebar .team { display: flex; align-items: center; gap: 10px; padding: 4px 14px 6px; font-family: var(--font-display); font-size: 46px; line-height: 1; }
.scorebar .team .nm { font-family: var(--font-label); font-size: 12px; letter-spacing: .12em; }
.scorebar .blue { background: var(--blue); box-shadow: inset 0 -5px 0 var(--blue-deep); }
.scorebar .orange { background: var(--orange); box-shadow: inset 0 -5px 0 var(--orange-deep); color: var(--ink); }
.scorebar .clock { display: grid; place-items: center; min-width: 96px; padding: 2px 12px 5px; background: var(--ink); font-family: var(--font-display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.scorebar .clock small { display: block; font-family: var(--font-label); font-size: 10px; letter-spacing: .1em; color: var(--gold); }
.hud-em { top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
.hud-mode { top: calc(14px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; align-items: center; }
.hud-mode img { width: 32px; height: 32px; }
#minimap { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 132px; height: 200px; border: var(--px) solid var(--ink); background: rgba(9,11,22,.6); box-shadow: 4px 4px 0 rgba(0,0,0,.4); }
.crosshair { left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; }
.crosshair::before, .crosshair::after { content: ""; position: absolute; background: var(--text); box-shadow: 0 0 0 2px rgba(9,11,22,.7); }
.crosshair::before { left: 9px; top: 0; width: 4px; height: 22px; }
.crosshair::after { left: 0; top: 9px; width: 22px; height: 4px; }
.crosshair.on::before, .crosshair.on::after { background: var(--gold); }
.charge { left: 50%; top: calc(50% + 26px); transform: translateX(-50%); width: 120px; height: 12px; background: var(--ink); border: 2px solid var(--ink); }
.charge i { display: block; height: 100%; width: 0%; background: var(--gold); }
.charge.lob i { background: var(--blue-light); }
.charge span { position: absolute; top: 14px; left: 0; right: 0; text-align: center; font-family: var(--font-label); font-size: 10px; letter-spacing: .1em; }
.dock { left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; justify-items: center; gap: 8px; }
.flowbar { width: 420px; max-width: 70vw; display: grid; gap: 3px; }
.flowbar .lbl { display: flex; justify-content: space-between; font-family: var(--font-label); font-size: 11px; letter-spacing: .1em; text-shadow: 2px 2px 0 var(--ink); }
.flowbar .track { height: 12px; background: var(--ink); border: 2px solid var(--ink); position: relative; }
.flowbar .fill { height: 100%; width: 0%; background: var(--aura, var(--emerald)); }
.flowbar .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--ink) calc(10% - 2px) 10%); }
.flowbar.ready .lbl b { color: var(--gold); animation: blink .6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.stamina { display: flex; gap: 2px; }
.stamina img { width: 22px; height: 22px; }
.hotbar { display: flex; gap: 8px; align-items: flex-end; padding-bottom: 12px; }
.slot { position: relative; width: 62px; height: 62px; background: rgba(9,11,22,.78); border: var(--px) solid var(--ink); box-shadow: inset 0 0 0 3px var(--slate-3); display: grid; place-items: center; }
.slot img { width: 38px; height: 38px; }
.slot .k { position: absolute; left: -3px; top: -3px; }
.slot .cd { position: absolute; inset: 0; background: conic-gradient(rgba(9,11,22,.82) var(--p, 0deg), transparent 0); }
.slot .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 30px; text-shadow: 2px 2px 0 var(--ink); }
.slot .nm { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); max-width: 68px; overflow: hidden; text-overflow: clip; white-space: nowrap; font-family: var(--font-label); font-size: 8px; letter-spacing: 0; text-shadow: 1px 1px 0 var(--ink); }
.slot.small { width: 46px; height: 46px; }
.slot.small img { width: 26px; height: 26px; }
.slot.ready { box-shadow: inset 0 0 0 3px var(--gold); }
.slot.active { box-shadow: inset 0 0 0 3px var(--aura, var(--emerald)); }
.slot .pips { position: absolute; bottom: 3px; left: 0; right: 0; display: flex; justify-content: center; gap: 3px; }
.slot .pips i { width: 8px; height: 5px; background: var(--slate-3); }
.slot .pips i.on { background: var(--text); }
.hotbar .sep { width: 6px; }
.toasts { top: calc(168px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; }
.toast { font-family: var(--font-label); font-size: 13px; font-weight: 700; letter-spacing: .08em; padding: 4px 10px; background: rgba(9,11,22,.82); border: 2px solid var(--ink); animation: toastIn .18s steps(3); }
.toast.good { color: var(--emerald); }
.toast.bad { color: var(--danger); }
.toast.gold { color: var(--gold); }
@keyframes toastIn { from { transform: translateY(-8px); opacity: 0; } }
.banner { left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; }
.banner .big { font-family: var(--font-display); font-size: clamp(72px, 14vw, 190px); line-height: .8; color: var(--text); text-shadow: 6px 6px 0 var(--bc, var(--blue)), 12px 12px 0 var(--ink); }
.banner .small { margin-top: 12px; font-family: var(--font-label); font-size: clamp(12px, 1.6vw, 18px); letter-spacing: .16em; text-shadow: 2px 2px 0 var(--ink); }
.banner.pop .big { animation: pop .5s steps(5); }
@keyframes pop { 0% { transform: scale(2.2); opacity: 0; } 60% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1); } }
.itemslot { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.hint { left: 50%; top: calc(124px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); max-width: calc(100% - 32px); box-sizing: border-box; font-family: var(--font-label); font-size: 12px; letter-spacing: .08em; padding: 6px 10px; background: rgba(9,11,22,.8); text-align: center; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.flabel { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; font-family: var(--font-display); font-size: 24px; line-height: 1; padding: 2px 6px 4px; color: var(--ink); background: var(--c, var(--text)); border: 2px solid var(--ink); }
.flabel.call { background: var(--emerald); font-size: 22px; }
.flabel.think { background: var(--text); letter-spacing: .12em; animation: think .5s steps(2) infinite; }
@keyframes think { 50% { opacity: .55; } }
.flabel.me { background: transparent; border: 0; color: var(--text); font-size: 18px; text-shadow: 2px 2px 0 var(--ink); }

/* overlays */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(9,11,22,.66); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; box-sizing: border-box; overflow-y: auto; }
.dialog { width: min(560px, 100%); padding: 22px; display: grid; gap: 16px; box-sizing: border-box; }
.dialog h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 72px; line-height: .85; text-shadow: 4px 4px 0 var(--ink); }
.dialog .row { display: flex; gap: 10px; flex-wrap: wrap; }
.dialog .row .btn { flex: 1 1 160px; }
.set { display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: center; }
.seg { display: flex; }
.seg button { font-family: var(--font-label); font-size: 11px; font-weight: 700; padding: 7px 10px; background: var(--slate-2); border: 2px solid var(--ink); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--ink); }
input[type="range"] { accent-color: var(--gold); width: 160px; }
.res-score { font-family: var(--font-display); font-size: 48px; line-height: 1; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.res-score .b { color: var(--blue-light); } .res-score .o { color: var(--orange); }
.res-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.res-grid div { background: var(--ink); padding: 8px; display: grid; gap: 2px; }
.res-grid b { font-family: var(--font-display); font-size: 34px; font-weight: 400; line-height: 1; }
.earn { display: grid; gap: 4px; font-size: 20px; }
.earn div { display: flex; justify-content: space-between; border-bottom: 2px dashed var(--slate-3); padding-bottom: 3px; }
.earn .tot { color: var(--emerald); border: 0; }
.rankline { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
.rankline img { width: 56px; height: 56px; }
#scoreboard { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(720px, calc(100% - 32px)); padding: 16px; box-sizing: border-box; }
#scoreboard table { width: 100%; border-collapse: collapse; font-size: 20px; font-variant-numeric: tabular-nums; }
#scoreboard th { font-family: var(--font-label); font-size: 10px; letter-spacing: .1em; color: var(--muted); text-align: left; padding: 4px 6px; }
#scoreboard td { padding: 5px 6px; border-top: 2px solid var(--ink); }
#scoreboard tr.me td { color: var(--gold); }
#scoreboard td { white-space: nowrap; }
#scoreboard th .sm { display: none; }
@media (max-width: 560px) {
  #scoreboard { padding: 10px 8px; }
  #scoreboard th .lg { display: none; }
  #scoreboard th .sm { display: inline; }
  #scoreboard table { font-size: 15px; }
  #scoreboard td, #scoreboard th { padding: 4px 4px; }
}
#scoreboard .tb { width: 10px; padding: 0; }
#flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: #fff; }
/* replays: an offer button after big moments, then letterbox bars, a REPLAY badge, SKIP and SAVE CLIP */
#replay { position: absolute; inset: 0; pointer-events: none; }
#replay .rp-offer { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(72px + env(safe-area-inset-top, 0px)); pointer-events: auto; }
#replay .rp-offer.pop { animation: riseIn .3s steps(3); }
#replay .rp-on { position: absolute; inset: 0; }
#replay .rp-on::before, #replay .rp-on::after { content: ""; position: absolute; left: 0; right: 0; height: 9%; background: #000; }
#replay .rp-on::before { top: 0; } #replay .rp-on::after { bottom: 0; }
#replay .rp-badge { position: absolute; z-index: 1; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(9% + 10px); font-size: 13px; padding: 6px 10px; background: var(--danger); color: var(--text); }
#replay .rp-badge b { animation: blink 1s steps(2) infinite; }
#replay .rp-ctl { position: absolute; z-index: 1; left: 50%; bottom: calc(9% + 12px); transform: translateX(-50%); display: flex; gap: 10px; pointer-events: auto; }
#replay .rp-note { position: absolute; z-index: 1; left: 50%; bottom: calc(9% + 70px); transform: translateX(-50%); white-space: nowrap; color: var(--text); text-shadow: 1px 1px 0 var(--ink); }
body.replaying #hud, body.replaying #labels { display: none !important; }
/* cut-in for big moves: speed lines, then a slanted comic panel with your face and the move name, 0.8s in all */
#cutin { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#cutin .ci-lines { position: absolute; inset: -20%; opacity: 0;
  background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,0) 0deg 4deg, rgba(255,255,255,.5) 4deg 5deg, rgba(255,255,255,0) 5deg 9deg, var(--ci, #fff) 9deg 9.6deg);
  -webkit-mask-image: radial-gradient(circle, transparent 26%, #000 62%); mask-image: radial-gradient(circle, transparent 26%, #000 62%); }
#cutin .ci-panel { position: absolute; left: -10%; right: -10%; top: 30%; height: min(30%, 190px); display: flex; align-items: center; gap: clamp(10px, 2vw, 24px); padding-left: 14%; box-sizing: border-box;
  transform: skewY(-6deg) translateX(-110%); background: linear-gradient(90deg, var(--ink) 0 9%, var(--ci, #3d7dff) 9% 10.5%, var(--ink) 10.5% 60%, rgba(9,11,22,.85) 100%);
  border-top: 6px solid var(--ci, #3d7dff); border-bottom: 6px solid var(--ci, #3d7dff); }
#cutin .ci-face canvas { width: clamp(72px, 16vh, 150px); height: clamp(72px, 16vh, 150px); transform: skewY(6deg); border: 4px solid var(--ci, #3d7dff); display: block; }
#cutin .ci-text { display: grid; gap: 4px; transform: skewY(6deg); }
#cutin #ci-name { font-family: var(--font-display); font-weight: 400; font-size: clamp(40px, 9vh, 96px); line-height: .85; color: var(--text); text-shadow: 4px 4px 0 var(--ci, #3d7dff), 8px 8px 0 #000; white-space: nowrap; }
#cutin #ci-style { font-family: var(--font-label); font-size: 12px; letter-spacing: .16em; color: var(--ci, #fff); }
#cutin.go .ci-lines { animation: ciLines .8s steps(8) forwards; }
#cutin.go .ci-panel { animation: ciPanel .8s cubic-bezier(.2,.9,.3,1) forwards; }
@keyframes ciLines { 0% { opacity: 0; transform: rotate(0deg); } 15% { opacity: 1; } 75% { opacity: .8; } 100% { opacity: 0; transform: rotate(8deg); } }
@keyframes ciPanel { 0% { transform: skewY(-6deg) translateX(-110%); } 16% { transform: skewY(-6deg) translateX(0); } 78% { transform: skewY(-6deg) translateX(3%); } 100% { transform: skewY(-6deg) translateX(115%); } }
#flash.rainbow { background: linear-gradient(90deg, #ff4d5e, #ffcb3d, #2ee38f, #4aa8ff, #b65cff); }
#boot { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink); font-family: var(--font-display); font-size: 40px; color: var(--muted); }
@media (max-width: 760px) {
  .locker { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(200px, 40vh) minmax(0, 1fr); }
  .lk-body { grid-template-columns: minmax(0, 1fr); }
  .lk-body .detail { position: static; }
  .lk-cap b { font-size: 24px; }
  .lk-cap .btn { font-size: 20px; padding: 4px 10px 7px; }
  .scorebar .team { font-size: 34px; padding: 3px 8px 5px; }
  .scorebar .team .nm { display: none; }
  .flowbar { width: 300px; }
  .slot { width: 50px; height: 50px; }
  .sub-head h2 { font-size: 48px; }
  .res-grid { grid-template-columns: repeat(2, 1fr); }
  #minimap { display: none; }
}
/* ---------- touch controls: thumb arc of pixel-round buttons, floating stick ---------- */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
body { -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#touch {
  position: absolute; inset: 0; touch-action: none; overflow: hidden; -webkit-user-select: none; user-select: none;
  --pxc: polygon(25% 0, 75% 0, 75% 12.5%, 87.5% 12.5%, 87.5% 25%, 100% 25%, 100% 75%, 87.5% 75%, 87.5% 87.5%, 75% 87.5%, 75% 100%, 25% 100%, 25% 87.5%, 12.5% 87.5%, 12.5% 75%, 0 75%, 0 25%, 12.5% 25%, 12.5% 12.5%, 25% 12.5%);
}
#touch .tb {
  position: absolute; left: 0; top: 0; width: var(--sz, 60px); height: var(--sz, 60px); box-sizing: border-box;
  transform: translate(calc(var(--x, 0px) - 50%), calc(var(--y, 0px) - 50%));
  -webkit-clip-path: var(--pxc); clip-path: var(--pxc); background: rgba(9,11,22,.66);
}
#touch .tb::before { content: ""; position: absolute; inset: 3px; -webkit-clip-path: var(--pxc); clip-path: var(--pxc); background: var(--fill, rgba(44,52,99,.5)); }
#touch .tb .ic { position: absolute; left: 25%; top: 15%; width: 50%; height: 50%; background: center / contain no-repeat; image-rendering: pixelated; pointer-events: none; }
#touch .tb .lb {
  position: absolute; left: 7%; right: 7%; bottom: 13%; text-align: center; pointer-events: none;
  font-family: var(--font-label); font-weight: 700; font-size: max(8px, calc(var(--sz, 60px) * .135)); line-height: 1; letter-spacing: 0;
  color: var(--text); text-shadow: 1px 1px 0 var(--ink); white-space: nowrap; overflow: hidden;
}
#touch .tb .cd { position: absolute; inset: 3px; -webkit-clip-path: var(--pxc); clip-path: var(--pxc); background: conic-gradient(rgba(9,11,22,.8) var(--p, 0deg), transparent 0); pointer-events: none; }
#touch .tb .num { position: absolute; left: 0; right: 0; top: 0; bottom: 20%; display: grid; place-items: center; font-family: var(--font-display); font-size: calc(var(--sz, 60px) * .48); line-height: 1; text-shadow: 2px 2px 0 var(--ink); pointer-events: none; }
#touch .tb .num:empty { display: none; }
#touch .tb.big { --fill: rgba(61,125,255,.52); }
#touch .tb.big .lb { bottom: 15%; }
#touch .tb.pass { --fill: rgba(26,60,158,.5); }
#touch .tb .chg { position: absolute; inset: 3px; -webkit-clip-path: var(--pxc); clip-path: var(--pxc); background: linear-gradient(to top, rgba(255,203,61,.62) var(--c, 0%), transparent 0); pointer-events: none; }
#touch .tb.charging .ic { transform: scale(1.1); }
#touch .tb.down { --fill: rgba(255,203,61,.42); }
#touch .tb.down .ic { transform: translateY(2px); }
#touch .tb.big.down { --fill: rgba(90,150,255,.72); }
#touch .tb.ready { background: var(--aura, var(--emerald)); }
#touch .tb.flow.ready { background: var(--gold); animation: blink .6s steps(2) infinite; }
#touch .tb.flow.active { background: var(--aura, var(--emerald)); --fill: rgba(255,255,255,.18); }
#touch .tb.item.ready { background: var(--gold); }
#touch .tb.off .ic { opacity: .38; }
#touch .tb.dt.dodge { --fill: rgba(245,239,224,.16); }
#touch .tb .pips { display: none; }
#touch .tb.dt.dodge .pips { position: absolute; top: 8%; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; pointer-events: none; }
#touch .tb .pips i { width: 9px; height: 5px; background: var(--slate-3); }
#touch .tb .pips i.on { background: var(--text); }
#touch .tb.sm .ic { left: 22%; top: 22%; width: 56%; height: 56%; }
#touch .tb .ic { z-index: 1; }
#touch .tb .cd { z-index: 2; }
#touch .tb .lb, #touch .tb .num, #touch .tb .pips { z-index: 3; }
#touch .tboard { position: absolute; left: 50%; top: 0; width: 280px; height: calc(60px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); }
#touch .stick { position: absolute; inset: 0; pointer-events: none; }
#touch .stick > div { position: absolute; left: 0; top: 0; -webkit-clip-path: var(--pxc); clip-path: var(--pxc); }
#touch .stick .ring { width: calc(var(--R, 56px) * 2.6); height: calc(var(--R, 56px) * 2.6); transform: translate(calc(var(--bx, 0px) - 50%), calc(var(--by, 0px) - 50%)); background: rgba(245,239,224,.08); }
#touch .stick .base { width: calc(var(--R, 56px) * 2); height: calc(var(--R, 56px) * 2); transform: translate(calc(var(--bx, 0px) - 50%), calc(var(--by, 0px) - 50%)); background: rgba(9,11,22,.5); }
#touch .stick .knob { width: calc(var(--R, 56px) * .9); height: calc(var(--R, 56px) * .9); transform: translate(calc(var(--kx, 0px) - 50%), calc(var(--ky, 0px) - 50%)); background: rgba(245,239,224,.8); box-shadow: inset 0 -5px 0 rgba(0,0,0,.25); }
#touch .stick.sprint .ring { background: rgba(255,203,61,.32); }
#touch .stick.sprint .knob { background: var(--gold); }
#touch .stick .lb { position: absolute; left: 0; top: 0; transform: translate(calc(var(--bx, 0px) - 50%), calc(var(--by, 0px) + var(--R, 56px) + 6px)); font-family: var(--font-label); font-size: 10px; letter-spacing: .1em; color: var(--text); text-shadow: 1px 1px 0 var(--ink); }
#touch .stick:not(.idle) .lb, #touch .stick.idle .ring { display: none; }
